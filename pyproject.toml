[project]
name = "gig-worker-companion"
version = "1.0.0"
description = "Saathi — a multilingual GenAI companion for gig and informal workers in India"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends() in defaults is idiomatic
    "RUF001",  # multilingual app: Indic scripts and ₹ are intentional
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# User-facing translation strings are kept on one line for translators.
"app/services/earnings.py" = ["E501"]
"app/services/context_engine.py" = ["E501"]
"app/services/grievance.py" = ["E501"]
"app/services/planner.py" = ["E501"]
"app/services/assistant.py" = ["E501"]
"tests/*" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
